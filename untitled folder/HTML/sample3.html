<!DOCTYPE html>
<html>

<head>
    <title>Registration Form</title>
</head>

<body>
    <div style="border: 1px solid black; 
    height: 60vh; 
    width: 50%;
    text-align: center;
    margin: auto;
    margin-top: 8%;">
        <h2>Registration Form</h2>
        <div style="float: left; margin-left: 20px;margin-top: 20px;margin-bottom:20px">
        <img src="Sample_User_Icon.png" width="200px" height="200px" alt="User Icon">
        </div>
        <div style="float: left; margin-left: 20px; margin-top: 40px; text-align: left;">
            First Name: <input type="text" /> <br /><br />
            Last Name: <input type="text" /> <br /><br />
            Email: <input type="email" /> <br /><br />
            Age: <input type="number" /> <br /><br />
            <label> Address: </label>
            <textarea rows="4" cols="20"></textarea> <br /><br />
            <input type="submit" value="Save">
            <input type="submit" value="Cancel">
        </div>
    </div>
</body>

</html>
